<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#159edc"><title>興嘉國小｜網頁書籤管理</title>
  <style>
    :root{--ink:#174047;--teal:#127c82;--green:#4d9e76;--gold:#f6bd44;--paper:#fffdf5;--line:#d9e7df;--coral:#e76f51}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:#f5f3e8}button,input{font:inherit}button{cursor:pointer}.hero{min-height:300px;position:relative;isolation:isolate;overflow:hidden;color:white;background:#166e73 url('assets/school.jpg') center 38%/cover no-repeat}.hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(5,62,65,.88),rgba(10,94,94,.6),rgba(10,80,78,.2))}.hero:after{content:"";position:absolute;inset:auto 0 0;height:55px;background:linear-gradient(172deg,transparent 49%,#f5f3e8 50%)}.topbar,.hero-copy,.main{width:min(1120px,calc(100% - 32px));margin:auto}.topbar{padding:18px 0;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-weight:800}.brand img{width:48px;height:48px;object-fit:contain;background:white;border-radius:50%;padding:3px}.admin-btn,.action,.close{border:0;border-radius:999px;padding:10px 16px;background:white;color:var(--teal);font-weight:800;box-shadow:0 2px 9px #003b3b33}.hero-copy{padding:34px 0 70px;max-width:1120px}.hero-copy h1{font-size:clamp(2rem,5vw,3.2rem);letter-spacing:.05em;margin:0 0 8px}.hero-copy p{margin:0;font-size:1.1rem}.main{margin-top:-28px;position:relative;z-index:2}.search-panel{background:var(--paper);border-radius:22px;padding:18px;box-shadow:0 10px 24px #19473a22}.search-row{display:flex;gap:10px}.search-row input{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:12px;outline-color:var(--teal)}.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{border:1px solid var(--line);background:white;color:var(--ink);border-radius:999px;padding:8px 14px}.chip.active{background:var(--teal);border-color:var(--teal);color:white}.list-heading{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}.list-heading h2{margin:0;font-size:1.35rem}.count{color:#547278}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;padding-bottom:42px}.card{position:relative;background:var(--paper);padding:18px;border-radius:18px;box-shadow:0 5px 14px #19473a16;border:1px solid #ffffff;transition:transform .15s}.card:hover{transform:translateY(-3px)}.number{color:var(--teal);font-weight:900;font-size:.85rem}.category{display:inline-block;margin:10px 0 5px;padding:4px 9px;border-radius:999px;color:#286445;background:#ddf0df;font-size:.8rem;font-weight:bold}.card h3{margin:5px 0 16px;font-size:1.15rem;min-height:2.7em}.links{display:flex;gap:9px}.icon-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--line);border-radius:10px;width:42px;height:38px;color:var(--teal);font-weight:bold}.favicon{width:18px;height:18px}.manage-tools{display:none;gap:6px;position:absolute;right:14px;top:14px}.managed .manage-tools{display:flex}.small{border:0;background:#f3f6ef;border-radius:8px;padding:6px 8px;color:var(--ink)}.small.delete{color:#a73b28}.empty{grid-column:1/-1;text-align:center;padding:45px;color:#577777}.students{position:fixed;z-index:-1;right:-20px;bottom:-35px;width:160px;opacity:.2}.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:#073e3e91}.modal[hidden]{display:none}.dialog{width:min(480px,100%);position:relative;background:var(--paper);padding:26px;border-radius:20px;box-shadow:0 16px 40px #002d2dcc}.dialog h2{margin-top:0}.close{position:absolute;right:12px;top:12px;padding:6px 10px}.field{display:grid;gap:6px;margin:13px 0;font-weight:700}.field input{padding:11px;border:1px solid var(--line);border-radius:9px}.submit{border:0;border-radius:10px;background:var(--teal);color:white;width:100%;padding:12px;font-weight:800;margin-top:10px}.error{color:#b43a28;min-height:1.3em;font-size:.9rem}.toast{position:fixed;z-index:20;left:50%;bottom:20px;transform:translateX(-50%);background:#174047;color:white;border-radius:999px;padding:10px 17px}.toast[hidden]{display:none}@media(max-width:560px){.hero{min-height:270px}.topbar,.hero-copy,.main{width:min(100% - 22px,1120px)}.brand span{font-size:.9rem}.admin-btn{padding:9px 12px}.hero-copy{padding-top:26px}.students{width:110px}.search-row{display:block}.search-row input{margin-bottom:8px}}
    /* V2.3 水彩校園首頁 */
    body{background:linear-gradient(180deg,#f9fdff 0,#fffdf5 67%,#f0f8db 100%)}.hero{min-height:360px;background:#dff5ff url('assets/school.jpg') center 42%/cover no-repeat;color:#164a5c}.hero:before{background:linear-gradient(90deg,rgba(255,255,255,.94) 0%,rgba(255,255,255,.45) 44%,rgba(255,255,255,.08) 100%)}.hero:after{display:none}.topbar{position:relative;z-index:2;width:min(1420px,calc(100% - 48px));padding:15px 0}.brand{align-items:flex-start;color:#173d49;text-shadow:0 1px white}.brand img{width:132px;height:106px;padding:0;background:transparent;border-radius:0;object-fit:contain}.brand span{margin-top:75px;margin-left:-123px;font-size:.72rem;font-weight:700;white-space:nowrap}.admin-btn{background:linear-gradient(135deg,#50bd79,#258c72);color:white;padding:12px 22px;font-size:1rem;border:3px solid #fff}.hero-copy{position:relative;z-index:2;width:min(1420px,calc(100% - 48px));padding:46px 0 60px}.hero-copy h1{display:table;margin:0;color:#1679bb;font-size:clamp(2.7rem,6vw,5.3rem);line-height:1.03;letter-spacing:.12em;text-shadow:-3px -3px 0 white,3px 3px 0 white,0 5px 0 #c7ebf6}.hero-copy h1::first-letter{color:#12a872}.hero-copy p{margin:20px 0 0 22px;font-size:clamp(1.15rem,2vw,1.7rem);font-weight:800;letter-spacing:.14em;color:#235366;text-shadow:0 2px white}.students{z-index:1;position:absolute;right:4%;bottom:-25px;width:min(34vw,470px);opacity:1;filter:drop-shadow(0 8px 8px #255b6355)}.main{width:min(1420px,calc(100% - 48px));margin:-1px auto 0}.search-panel{position:relative;display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.94);padding:15px 0;border-radius:0;box-shadow:0 2px 15px #2e84501a}.search-row{order:2;margin-left:auto;width:min(410px,100%)}.search-row:after{content:'搜尋';display:inline-flex;align-items:center;justify-content:center;margin-left:10px;border-radius:12px;height:43px;width:76px;background:#129ce4;color:#fff;font-weight:800;vertical-align:top}.search-row input{width:calc(100% - 90px);height:43px;background:#fff;border-radius:12px;padding-left:16px}.filter-row{order:1;display:flex;gap:10px;flex:1;margin:0;overflow-x:auto;padding:0 0 5px}.chip{min-width:92px;min-height:78px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:8px 10px;border:0;border-radius:17px;background:linear-gradient(145deg,#effaff,#e6f5ff);color:#1c5c75;font-weight:800;box-shadow:0 4px 10px #4790a41a}.chip .filter-icon{font-size:1.55rem;line-height:1}.chip.active{color:#1269b4;background:linear-gradient(145deg,#d9f3ff,#edf9ff);box-shadow:inset 0 0 0 2px #a9dfff}.list-heading{margin:23px 0 16px}.list-heading h2{font-size:1.45rem;color:#176681}.count{font-weight:800}.cards{grid-template-columns:repeat(5,minmax(0,1fr));gap:15px;padding-bottom:58px}.card{min-height:170px;padding:13px 14px 12px;border-radius:15px;border:1px solid #e4eef1;box-shadow:0 4px 13px #1b60841c}.card:hover{transform:translateY(-4px);box-shadow:0 9px 18px #1b608430}.number{position:absolute;left:13px;top:13px;color:#6d8797}.category{margin:31px 0 6px;padding:3px 8px;color:#3c6e80;background:#e5f5ff}.card h3{margin:0 0 6px;min-height:1.5em;font-size:1.05rem;color:#173d65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .site-note{margin:0 0 11px;color:#55707e;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.links{border-top:1px solid #eaf0f2;padding-top:9px}.icon-link{width:100%;height:34px;background:linear-gradient(90deg,#eff9ff,#e9f7ff);border:0;border-radius:9px;color:#078bea;font-size:.92rem;font-weight:800}.icon-link+.icon-link{display:none}.favicon{width:18px;height:18px;margin-right:7px}.icon-link:after{content:'前往網站'}.manage-tools{z-index:2}.small{background:#fff}.empty{background:white;border-radius:15px}.dialog{border:2px solid #e0f2ed}.toast{background:#168d74}@media(max-width:1050px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.students{width:330px;right:-10px}.hero-copy{padding-top:64px}}@media(max-width:700px){.hero{min-height:310px;background-position:55% center}.topbar,.hero-copy,.main{width:min(100% - 24px,1420px)}.brand img{width:86px;height:70px}.brand span{margin-top:52px;margin-left:-81px;font-size:.55rem}.hero-copy{padding:54px 0 42px}.hero-copy h1{font-size:2.5rem;max-width:270px}.hero-copy p{margin-left:6px;font-size:1rem;max-width:260px}.students{width:190px;right:-20px;bottom:-14px}.search-panel{display:block;padding:11px;background:white}.filter-row{margin-bottom:12px}.chip{min-width:72px;min-height:61px;font-size:.76rem}.search-row{width:100%}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:11px;min-height:155px}.card h3{font-size:.95rem}.admin-btn{padding:9px 11px;font-size:.86rem}}
  </style>
</head>
<body>
  <header class="hero"><div class="topbar"><div class="brand"><img src="assets/logo.png" alt="興嘉國小校徽" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2750%27 fill=%27%23fff%27/%3E%3Cpath d=%27M18 36l32-17 32 17v34H18z%27 fill=%27%23127c82%27/%3E%3Cpath d=%27M24 39h52v6H24zm0 12h52v6H24zm0 12h52v6H24z%27 fill=%27%23f6bd44%27/%3E%3Ctext x=%2750%27 y=%2791%27 text-anchor=%27middle%27 font-size=%2715%27 font-family=%27sans-serif%27 fill=%27%23174047%27%3E興嘉%3C/text%3E%3C/svg%3E'" ><span>嘉義市興嘉國民小學</span></div><button class="admin-btn" id="adminButton">⚙ 管理登入</button></div><div class="hero-copy"><h1>網頁書籤管理</h1><p>好網站，讓學習更簡單！</p></div><img class="students" src="assets/students.png" alt="興嘉國小學生插圖"></header>
  <main class="main"><section class="search-panel"><div class="search-row"><input id="search" type="search" placeholder="搜尋網站名稱、類別或網址…" aria-label="搜尋書籤"></div><div id="filters" class="filter-row" aria-label="類別篩選"></div></section><div class="list-heading"><h2>網站書籤</h2><span class="count" id="count">載入中…</span></div><section id="cards" class="cards" aria-live="polite"></section></main>
  <div class="modal" id="loginModal" hidden><form class="dialog" id="loginForm"><button type="button" class="close" data-close>×</button><h2>管理者登入</h2><label class="field">管理密碼<input id="password" type="password" autocomplete="current-password" required></label><p class="error" id="loginError"></p><button class="submit">登入</button></form></div>
  <div class="modal" id="editModal" hidden><form class="dialog" id="bookmarkForm"><button type="button" class="close" data-close>×</button><h2 id="formTitle">新增網站</h2><input id="bookmarkId" type="hidden"><label class="field">類別<input id="category" maxlength="60" required placeholder="例如：教學資源"></label><label class="field">網站名稱<input id="name" maxlength="120" required></label><label class="field">網址<input id="url" type="url" required placeholder="https://example.com"></label><p class="error" id="formError"></p><button class="submit" id="saveButton">儲存</button></form></div>
  <div class="toast" id="toast" hidden></div>
  <script>
    // 已設定正式 GAS 網頁應用程式網址。密碼只由管理者輸入，絕不寫入前端程式。
    const API_URL = 'https://script.google.com/macros/s/AKfycbzDWo9MRqc06jF-yZ9ouRkznMWs41DUMwNQfUgc-4DTJ2d7EftUYpMjEEdhdlCXWzP5/exec';
    let items=[], selectedCategory='全部', adminKey='';
    const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function host(url){try{return new URL(url).hostname}catch{return ''}}
    async function api(data=null){const options=data?{method:'POST',body:JSON.stringify(data),headers:{'Content-Type':'text/plain;charset=utf-8'}}:{};const res=await fetch(data?API_URL:API_URL+'?action=list',options);const json=await res.json();if(!json.ok)throw new Error(json.error||'服務暫時無法使用');return json}
    async function load(){try{items=(await api()).items||[];render()}catch(e){$('#cards').innerHTML='<p class="empty">無法讀取資料：'+esc(e.message)+'<br>請確認 GAS 已部署且可供存取。</p>';$('#count').textContent='讀取失敗'}}
    const categoryIcon=c=>({全部:'⌂',教學資源:'▣',行政系統:'▤',學生專區:'♟',家長專區:'♚',教育網站:'◎',常用工具:'★',生活資訊:'♥',校務專區:'♧'}[c]||'◆');
    function render(){const keyword=$('#search').value.trim().toLowerCase(),cats=['全部',...new Set(items.map(x=>x.category))];$('#filters').innerHTML=cats.map(c=>'<button class="chip '+(c===selectedCategory?'active':'')+'" data-category="'+esc(c)+'"><span class="filter-icon">'+categoryIcon(c)+'</span>'+esc(c)+'</button>').join('');document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{selectedCategory=b.dataset.category;render()});const shown=items.filter(x=>(selectedCategory==='全部'||x.category===selectedCategory)&&[x.name,x.category,x.url].join(' ').toLowerCase().includes(keyword));$('#count').textContent='共 '+shown.length+' 筆';$('#cards').classList.toggle('managed',!!adminKey);$('#cards').innerHTML=shown.length?shown.map((x,i)=>`<article class="card"><div class="manage-tools"><button class="small" data-edit="${x.id}">編修</button><button class="small delete" data-delete="${x.id}">刪除</button></div><span class="number">${i+1}</span><span class="category">${esc(x.category)}</span><h3>${esc(x.name)}</h3><p class="site-note">${esc(host(x.url)||x.url)}</p><div class="links"><a class="icon-link" href="${esc(x.url)}" target="_blank" rel="noopener" title="開啟網站"><img class="favicon" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(host(x.url))}&sz=64" alt="">↗</a><a class="icon-link" href="${esc(x.url)}" target="_blank" rel="noopener" title="預覽連結">⌁</a></div></article>`).join(''):'<p class="empty">尚無符合的網站書籤。</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(items.find(x=>x.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete))}
    function modal(id,show){$(id).hidden=!show}function toast(text){const t=$('#toast');t.textContent=text;t.hidden=false;setTimeout(()=>t.hidden=true,2600)}
    $('#search').addEventListener('input',render);$('#adminButton').onclick=()=>adminKey?logout():modal('#loginModal',true);document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{modal('#loginModal',false);modal('#editModal',false)});
    $('#loginForm').onsubmit=async e=>{e.preventDefault();const key=$('#password').value;$('#loginError').textContent='';try{await api({action:'verify',adminKey:key});adminKey=key;$('#password').value='';modal('#loginModal',false);$('#adminButton').textContent='＋ 新增網站';$('#adminButton').onclick=()=>openEditor();render();toast('已進入管理模式')}catch(err){$('#loginError').textContent=err.message}};function logout(){adminKey='';$('#adminButton').textContent='管理者登入';$('#adminButton').onclick=()=>modal('#loginModal',true);render();toast('已登出')}
    function openEditor(item){$('#formTitle').textContent=item?'編修網站':'新增網站';$('#bookmarkId').value=item?.id||'';$('#category').value=item?.category||'';$('#name').value=item?.name||'';$('#url').value=item?.url||'';$('#formError').textContent='';modal('#editModal',true)}
    $('#bookmarkForm').onsubmit=async e=>{e.preventDefault();const id=$('#bookmarkId').value,data={action:id?'update':'create',adminKey,id,category:$('#category').value,name:$('#name').value,url:$('#url').value};try{$('#saveButton').disabled=true;await api(data);modal('#editModal',false);await load();toast(id?'已更新網站':'已新增網站')}catch(err){$('#formError').textContent=err.message}finally{$('#saveButton').disabled=false}};
    async function remove(id){const item=items.find(x=>x.id===id);if(!confirm('確定要刪除「'+item.name+'」嗎？'))return;try{await api({action:'delete',adminKey,id});await load();toast('已刪除網站')}catch(e){toast(e.message)}}load();
  </script>
</body></html>
